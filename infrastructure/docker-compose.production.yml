
name: coquechas-agua

services:

  laravel-php:
    build:
      context: ../backend-laravel
    working_dir: /var/www/html
    restart: always
    command: php-fpm
    env_file:
      - ../../config/laravel.env
    volumes:
      - ../backend-laravel:/var/www/html
    networks:
      - coquechas-network

  laravel-nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ../backend-laravel:/var/www/html:ro
      - ./nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel-php
    networks:
      - coquechas-network
      
  react:
    build:
      context: ../frontend-react
      dockerfile: Dockerfile.dev
    restart: always
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend-react:/app
      - react_node_modules:/app/node_modules
    networks:
      - coquechas-network

  next:
    build:
      context: ../dashboard-next
      dockerfile: Dockerfile.dev
    restart: always
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    env_file:
      - ../../config/next.env
    ports:
      - "3000:3000"
    volumes:
      - ../dashboard-next:/app
      - next_node_modules:/app/node_modules
    networks:
      - coquechas-network

networks:
  coquechas-network:
    driver: bridge

volumes:
  react_node_modules:
  next_node_modules:
