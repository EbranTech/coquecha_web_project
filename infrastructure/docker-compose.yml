name: coquechas-agua

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-coquechas_root_local}
      MARIADB_DATABASE: coquechas_agua
      MARIADB_USER: coquechas_app
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-coquechas_app_local}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - coquechas-network

  moto:
    image: motoserver/moto:latest
    command: -H 0.0.0.0 -p 5000
    environment:
      MOTO_PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - coquechas-network

  laravel-php:
    build:
      context: ../backend-laravel
    working_dir: /var/www/html
    command: >-
      sh -c "chmod -R 777 storage bootstrap/cache && php-fpm"
    env_file:
      - ../backend-laravel/.env
    volumes:
      - ../backend-laravel:/var/www/html
      - laravel_vendor:/var/www/html/vendor
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - coquechas-network

  laravel-nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ../backend-laravel:/var/www/html:ro
      - ./nginx/laravel.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel-php
    networks:
      - coquechas-network

  react:
    build:
      context: ../frontend-react
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend-react:/app
      - react_node_modules:/app/node_modules
    networks:
      - coquechas-network

  next:
    build:
      context: ../dashboard-next
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ../dashboard-next:/app
      - next_node_modules:/app/node_modules
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - coquechas-network

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "8025:8025"
    networks:
      - coquechas-network

networks:
  coquechas-network:
    driver: bridge

volumes:
  mariadb_data:
  react_node_modules:
  next_node_modules:
  laravel_vendor:
